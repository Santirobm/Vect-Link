name: Vect-Link CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    name: Linux (${{ matrix.cc }} - Sanitizers)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [ gcc, clang ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-std=c99 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Build Release Shared Library & Run Python Tests
        if: matrix.cc == 'gcc'
        run: |
          cmake -B build-py -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-py --target vectlink_shared
          VTLK_LIB_PATH="${{ github.workspace }}/build-py" python3 -m unittest discover -s python/tests -v
          rm -rf build build-py

      - name: Test Clean Venv Packaging (scikit-build-core)
        if: matrix.cc == 'gcc'
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install ./python
          python -m unittest discover -s python/tests -v

  macos:
    name: macOS (Clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure & Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Test Clean Venv Packaging & Python Tests
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install ./python
          python -m unittest discover -s python/tests -v

  windows-msvc:
    name: Windows (MSVC /W4 /WX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_C_FLAGS="/TC /W4 /WX"

      - name: Build
        run: cmake --build build --config Release

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test Clean Venv Packaging & Python Tests
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install ./python
          python -m unittest discover -s python/tests -v
