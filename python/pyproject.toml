[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "vectlink"
version = "0.9.0"
description = "Zero-copy Python ctypes + memoryview bindings for Vect-Link shared-memory IPC and tensor codecs"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Santirobm" }]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.21"]

[tool.scikit-build]
cmake.source-dir = ".."
build.targets = ["vectlink_shared"]
wheel.packages = ["vectlink"]
build.verbose = false
